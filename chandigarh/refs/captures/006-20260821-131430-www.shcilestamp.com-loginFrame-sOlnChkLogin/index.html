<!DOCTYPE html><html><head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=9">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Online e-Stamping Guest Login</title>
        <link href="/OnlineStamping/libs/OlnCss.css" rel="stylesheet" type="text/css">
        <link rel="stylesheet" type="text/css" href="/OnlineStamping/libs/redmond/jquery-ui-1.10.2.custom.min.css">
        <script type="text/javascript" src="/OnlineStamping/libs/jquery.js"></script>
        <script type="text/javascript" src="/OnlineStamping/libs/jquery.validate.js"></script>
        <script src="/OnlineStamping/libs/jquery-ui.js" type="text/javascript"></script>
        <script src="/OnlineStamping/libs/commonValidation.js" type="text/javascript"></script>
        <script type="text/javascript" language="javascript">
         var sec = 120;
         $(document).ready(function()
        {
            document.getElementById('btnSubmit').disabled = true;
            $("#btnSubmit").removeClass().addClass("fSubmitDisb");
            $('#trloader').hide();

        
             sendViewTxnOtp();

             
            /*Jquery Validation*/
            $("#frmVrfMobile").validate({
                errorClass: 'err',
		rules: {
                        iConfOtp:{required:true,minlength:6}
                        },
		messages: {
                       iConfOtp:{ required:" * Please enter the valid OTP No."}},
                submitHandler: function(form) {
                                $('#trloader').show();
                                $('#trBtnCntl').hide();
                                form.submit();
                }//submitHandler   
	});/*End Jquery Validation*/
            $("#iConfOtp").focus();
        });
        
         function countDown() {
          if (sec < 10) {
            $("#otpTimer").html("0" + sec + " Seconds");
          } else {
            $("#otpTimer").html(sec + " Seconds");
          }
          if (sec <= 0) {
            $("#btnResendOTP").removeAttr("disabled");
            $("#btnResendOTP").removeClass().addClass("bSubmitSmall");
            $("#otpTimer").html("");
            //$("#otpTimer").fadeTo(2500, 0);
            return;
          }
          sec -= 1;
          window.setTimeout(countDown, 1000);
        }//countDown
        
     
    
        function sendViewTxnOtp()
        {   //?iUsr=compitcom&iMsgType=OLN_USR_LOGIN_VRF&iOlnTxnRef=admin@compitcom.inRV2613&iMob=-
            //var milliseconds = new Date().getTime();
            var formData = {
                'iUsr': "compitcom",'iMsgType': "OLN_USR_LOGIN_VRF",'iOlnTxnRef':"admin@compitcom.inRV2613",'iMob':"-"
                };
            $.ajax({ url: "/OnlineStamping/JSP/OlnSendSMSEmailOtp.jsp", 
                     type: 'POST',
                     data: formData ,
                     success: function(result) {
                    if ($.trim(result).indexOf("success|") == 0)
                    {
                    var vOtpReqID = $.trim(result).split("|")[1];
                    $("#iOtpReqID").val(vOtpReqID);
                    sec = 120;
                    countDown();
                    document.getElementById('btnResendOTP').disabled = true;
                    $("#btnResendOTP").removeClass().addClass("bSubmitSmallDisb");

                    document.getElementById('btnSubmit').disabled = false;
                    $("#btnSubmit").removeAttr("disabled");
                    $("#btnSubmit").removeClass().addClass("fSubmit");
                    $("#iConfOtp").focus();
                   }
                   else
                  {
                    alert("Invalid Details Provided or Limits Exceeded, Unable to Send OTP. Please try again.");
                  }
               }
            });
        }//sendViewTxnOtp
        
        function ResendOTP()
        {
            var vOtpReqId = $("#iOtpReqID").val();
            //alert(vOtpReqId);
            
            var formData = {
                'iUsr': "compitcom",'iOtpId': vOtpReqId
                };
            $.ajax({
                url: "/OnlineStamping/JSP/OlnResendOtp.jsp", 
                type: 'POST',
                data: formData ,
                success: function(result) {
                if ($.trim(result) == "success")
                {
                    sec = 120;
                    countDown();
                    document.getElementById('btnResendOTP').disabled = true;
                    $("#btnResendOTP").removeClass().addClass("bSubmitSmallDisb");                    
                }
                else
                {
                    alert("Invalid Details Provided or Limits Exceeded, Unable to ReSend OTP. Please try again.");
                }
                }
            });
        }//ResendOTP
        
      
                
     </script>
    </head>
    <body>
        <form name="frmVrfMobile" id="frmVrfMobile" action="/OnlineStamping/sOlnVrfUsrMob" method="post">
        <table class="tabReg" style="text-align:center;width:90%;margin-bottom:10px;margin-top:5px;margin-left: 50px;">
           <tbody><tr><td colspan="2" style="width:100%;text-align: left;">

                <div style="float:left; width: 100%;">
                <span class="fHeader">:: Online Payment System : User Login</span>
                </div>
                   
           </td></tr>
           <tr><td colspan="2" align="center"><hr style=" margin-bottom: 25px;"></td></tr>
            <tr>
                <td colspan="2" class="fItemText" style=" text-align: right"><span class="mand">*</span> Indicates that the field is mandatory.</td>
            </tr>
            
            <tr>
                <td width="25%" class="fItemText">User ID </td>
                <td width="75%" align="left"><input type="text" size="45" id="iUsr" name="iUsr" class="fItemInputLab" readonly="readonly" value="compitcom">
                </td>
            </tr>
            
            <tr>
                <td width="25%" class="fItemText">User Email </td>
                <td width="75%" align="left"><input type="text" size="45" id="iDispEmail" name="iDispEmail" class="fItemInputLab" readonly="readonly" value="adm*n@compitcom.in"> &nbsp;&nbsp; 
                </td>
            </tr>
            
            <tr id="trOtp">
                <td width="25%" class="fItemText"> Verification OTP <span class="mand">*</span></td>
                <td width="75%" colspan="3" align="left" class="fItemInputLab">
                    <input type="text" style="width:25%" id="iConfOtp" name="iConfOtp" maxlength="6" value="" class="fItemInputBox" onblur="checkNumber1(this);">&nbsp;&nbsp;
                    <input type="button" class="bSubmitSmallDisb" id="btnResendOTP" name="btnResendOTP" value="Resend OTP" onclick="ResendOTP();">&nbsp;<span id="otpTimer" style="width:100px;text-align:right;" class="mand"></span>
                    
                    <br><span class="fInfoText">OTP is Sent to User's Email for Verification, Please check.</span>
                    
                </td>
            </tr>  
            
            <tr><td colspan="2" align="center"><hr style=" margin-top: 10px;"></td></tr>
            <tr>
               <td colspan="2" align="center">
                  <input type="hidden" value="-" name="iOtpReqID" id="iOtpReqID"> 
                  <input type="hidden" value="OLN_USR_LOGIN_VRF" name="iMsgType" id="iMsgType"> 
                  <input type="hidden" value="admin@compitcom.inRV2613" name="iTxnRef" id="iTxnRef"> 
                  <input type="hidden" value="ESI" name="iProdCd" id="iProdCd"> 
                  <input type="hidden" value="-" name="iMobNo" id="iMobNo"> 
                  <input type="hidden" value="admin@compitcom.in" name="iEmailId" id="iEmailId"> 
                  <input type="hidden" value="110235219140_21081314202630108358" name="isid" id="isid"> 
               </td>
            </tr>
            <tr id="trBtnCntl">
               <td colspan="2" align="center">
                  <input type="submit" value="Verify OTP" name="btnSubmit" id="btnSubmit" class="fSubmit">
                 &nbsp;&nbsp;
                 <input type="button" value="Back" onclick="window.location.replace('/OnlineStamping/sOlnDelSession');" class="fSubmit">
                 
                 </td>
            </tr>
            <tr valign="center" align="center" id="trloader">
                <td colspan="2" style="align-content: center">
                    <div class="loader" style="text-align:center;vertical-align:central;width:64px;height:50px;background:url('/OnlineStamping/images/loading1.gif') 50% 50% no-repeat transparent ;opacity: 0.8;">
                    </div>
                </td>
            </tr>            
            <tr><td colspan="2" align="center"><hr style=" margin-top: 10px;"></td></tr>
        </tbody></table>
        <br>
        </form>
    

</body></html>

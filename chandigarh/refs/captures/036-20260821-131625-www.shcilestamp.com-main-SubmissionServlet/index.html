   //Back Button fix
   if (typeof history.pushState === "function") {
     history.pushState(null, null, location.href);
     window.addEventListener('popstate', function(event) {
            history.pushState(null, null, location.href);
            if(isPageLoaded){
                  alert('Do not click browser BACK or REFRESH buttons as this may end your transaction.\nPlease use the provided navigation buttons within the page during your transaction.');
            }
     });
   } else {
     location.hash = "pageLoad";
     hashChangeCounter = 1;
     $(window).on('hashchange', function() {
            if(hashChangeCounter > 2 && location.hash == "#backPageLoad"){
                  alert('Do not click browser BACK or REFRESH buttons as this may end your transaction.\nPlease use the provided navigation buttons within the page during your transaction.');
            }
            window.history.forward(0);
            hashChangeCounter++;
            location.hash = "backPageLoad";
     });
   }

   $(window).load(function () {
      setTimeout(function () { isPageLoaded = true; }, 1000);
   });

function redirect() {
    document.redirectToOnlinePaymentSystem.submit();
}

</script>

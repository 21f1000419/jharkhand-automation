name: Build Windows package

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the package to (optional)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-windows-package-${{ github.event.release.tag_name || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      PYTHONUTF8: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify OCR and browser imports
        run: |
          python -c "from services.paddleocr_ocr import PaddleOcrCaptchaSolver; PaddleOcrCaptchaSolver._create_model(); import easyocr; from playwright._impl._driver import compute_driver_executable; print(compute_driver_executable())"
        env:
          PYTHONPATH: src

      - name: Build PyInstaller package
        run: python -m PyInstaller --noconfirm --clean estamp_automation.spec

      - name: Validate the frozen package
        shell: pwsh
        run: .\scripts\validate_windows_dist.ps1

      - name: Create ZIP and checksum
        id: package
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'dist\jharni'
          $exePath = Join-Path $source 'Compitcom-eStamp-Automation.exe'
          $archiveName = 'jharni.zip'
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $checksumPath = "$archivePath.sha256"
          if (Test-Path -LiteralPath $archivePath) {
            Remove-Item -LiteralPath $archivePath -Force
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $source,
            $archivePath,
            [IO.Compression.CompressionLevel]::Optimal,
            $true
          )
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath $checksumPath -Encoding utf8
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
          "exe_path=$exePath" >> $env:GITHUB_OUTPUT
          Write-Host "Created $archiveName"
          Write-Host "Size: $([math]::Round((Get-Item -LiteralPath $archivePath).Length / 1MB, 1)) MiB"

      - name: Upload ZIP as Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: jharni
          path: ${{ steps.package.outputs.archive_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload EXE as Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: jharni-exe
          path: ${{ steps.package.outputs.exe_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Attach ZIP and checksum to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          EXE_PATH: ${{ steps.package.outputs.exe_path }}
        run: gh release upload "$env:RELEASE_TAG" "$env:ARCHIVE_PATH" "$env:CHECKSUM_PATH" "$env:EXE_PATH" --clobber

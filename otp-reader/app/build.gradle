plugins {
    id 'com.android.application'
}

android {
    namespace 'com.compitcom.otpreader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.compitcom.otpreader'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

// Keep a ready-to-install APK in the workspace root after every debug build.
tasks.register('copyDebugApk', Copy) {
    dependsOn 'assembleDebug'
    from layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    into rootProject.file('../dist')
    rename { 'otp-reader-debug.apk' }
}

tasks.configureEach {
    if (name == 'assembleDebug') {
        finalizedBy 'copyDebugApk'
    }
}
